# Validates the iOS build on a free GitHub-hosted macOS runner.
#
# NOTE: Apple requires a paid Apple Developer account ($99/year) to sign an
# app for real iPhones (or TestFlight). Without signing, this workflow
# produces an UNSIGNED device build — good for proving the code compiles
# for iOS, but it cannot be installed on a phone.
# Once you have the developer account, add signing (certificates +
# provisioning profile as secrets) and switch the build step to
# `flutter build ipa` with an ExportOptions.plist.
#
# Secrets (same as the Windows build):
#   SUPABASE_URL, SUPABASE_ANON_KEY
name: Build iOS (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # No --dart-define: the Supabase + Google ids are compiled in from
      # lib/config/*.dart, so a build can never end up with an empty key.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: 4cus-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
