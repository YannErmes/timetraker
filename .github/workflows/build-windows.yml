# Builds the 4cus Windows .exe on a free GitHub-hosted runner
# (which has Visual Studio preinstalled).
#
# One-time setup (GitHub repo > Settings > Secrets and variables > Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/public key
# Then: Actions tab > "Build Windows EXE" > Run workflow >
# download the `4cus-windows` artifact (zip with 4cus.exe + DLLs).
name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual run from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # No --dart-define: the Supabase + Google ids are compiled in from
      # lib/config/*.dart, so a build can never end up with an empty key.
      - name: Build EXE
        run: flutter build windows --release

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 4cus-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: 4cus-windows
          path: 4cus-windows.zip
          retention-days: 30
