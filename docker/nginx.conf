server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: unknown paths are routes, not files,
    # so they must fall back to index.html. The try_files below does this
    # without the "rewrite everything" behaviour that would also rewrite real
    # asset requests.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated by `flutter build web`. Fingerprinted, so they can be cached
    # hard; a new build changes the file name and busts the cache by itself.
    location ~* \.(js|wasm|css|json|svg|png|jpg|jpeg|gif|ico|webp|ttf|otf|woff2?|bin)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html must never be cached, or a deploy keeps serving the old
    # bootstrap and the stale bundle hash with it.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # The service worker is generated too, and it decides what the browser
    # runs offline. Same rule as index.html: always revalidate.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # index.html loads canvaskit from the Google CDN at runtime when present.
    # Self-host it instead so the app works offline and on a locked-down
    # network. The files land in build/web/canvaskit/.
    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Without this the browser never gets a signal to switch to the app's
    # service worker.
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # The app sends its own headers; nginx should not add a second, stricter
    # copy that could contradict them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A dashboard app is private: keep it out of search indexes and out of
    # embedding on other sites.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
